# Root config so `pytest` at the repository root runs both projects.
# importlib import mode is required: the ml and backend suites both live in a
# package called `tests`, which the default prepend mode cannot disambiguate.
[pytest]
testpaths = ml/tests backend/tests
addopts = -q --import-mode=importlib
pythonpath = backend ml
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
