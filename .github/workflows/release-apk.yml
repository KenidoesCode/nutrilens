name: Release APK

# Manual, or on a version tag. Building a signed APK on every push would burn
# CI time and expose the signing key far more often than necessary.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build the release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      # The keystore never lives in the repository. It is restored from a
      # secret for the duration of the build and removed afterwards.
      - name: Restore the signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Assemble
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_NUTRILENS_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ORG_GRADLE_PROJECT_NUTRILENS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_NUTRILENS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_NUTRILENS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nutrilens-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
